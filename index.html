<title>Relatório de Prática Profissional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: faixa institucional no topo, trilha de etapas à esquerda, formulário em coluna de leitura à direita. */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --sunk:#eaeee8; --line:#d3dacf; --fg:#1d261d; --muted:#5b6858;
  --brand:#2f8a3c; --brand-ink:#ffffff; --brand-soft:#e2f0e1; --red:#c0272d; --warn:#9a6400; --warn-soft:#fbf0d9; --ok:#2f8a3c;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-cor{display:none} :root:not([data-theme="light"]) .logo-branca{display:block}}
:root[data-theme="dark"] .logo-cor{display:none} :root[data-theme="dark"] .logo-branca{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121712; --surface:#1a211a; --sunk:#222b22; --line:#334033; --fg:#e4ebe2; --muted:#9caa98;
  --brand:#5cbf69; --brand-ink:#0d150d; --brand-soft:#1f3321; --red:#ef6b6f; --warn:#e6b45a; --warn-soft:#33290f; --ok:#5cbf69; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121712; --surface:#1a211a; --sunk:#222b22; --line:#334033; --fg:#e4ebe2; --muted:#9caa98;
  --brand:#5cbf69; --brand-ink:#0d150d; --brand-soft:#1f3321; --red:#ef6b6f; --warn:#e6b45a; --warn-soft:#33290f; --ok:#5cbf69; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;padding-block:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brandline{display:flex;gap:12px;align-items:center;min-width:0}
.logo{height:56px;width:auto;flex:none}
.logo-branca{display:none}
.brandline > div{border-left:1px solid var(--line);padding-left:12px}
.brandline h1{font-family:var(--f-display);font-weight:650;font-size:1.15rem;margin:0;line-height:1.2;text-wrap:balance}
.brandline p{margin:0;color:var(--muted);font-size:.82rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;font-size:.92rem}
button:hover{border-color:var(--brand)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:1px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--fg)}
button.danger{color:var(--red)}
.layout{max-width:1180px;margin:0 auto;padding-block:24px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.steps button{width:100%;text-align:left;border:0;background:transparent;display:grid;grid-template-columns:28px 1fr 12px;gap:8px;align-items:center;padding:7px 8px;border-radius:var(--r)}
nav.steps button .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
nav.steps button .s{font-size:.82rem;color:var(--muted);display:block;line-height:1.2}
nav.steps button[aria-current="step"]{background:var(--brand-soft)}
nav.steps button[aria-current="step"] .t{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.partial{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.dot.na{border-style:dashed}
main{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0 0 4px}
main h2{font-family:var(--f-display);font-weight:650;font-size:1.7rem;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--muted);max-width:68ch;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:700;font-size:.95rem}
.field label .req{color:var(--red);font-weight:400}
.help{color:var(--muted);font-size:.86rem;margin:0;max-width:72ch}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:110px;line-height:1.55}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.counter{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);align-self:flex-end;font-variant-numeric:tabular-nums}
.counter.bad{color:var(--warn)} .counter.good{color:var(--ok)}
h3.sub{font-family:var(--f-display);font-weight:650;font-size:1.15rem;margin:0;display:flex;gap:10px;align-items:baseline}
h3.sub .num{font-family:var(--f-mono);font-size:.85rem;color:var(--brand);font-weight:500}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.mod input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--brand)}
.mod b{display:block}
.mod small{color:var(--muted);display:block;font-size:.84rem;line-height:1.35;margin-top:2px}
.mod .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.mod:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.ed{border-collapse:collapse;width:100%;min-width:560px}
table.ed th{font-size:.8rem;text-align:left;color:var(--muted);font-weight:700;padding:8px;background:var(--sunk);border-bottom:1px solid var(--line)}
table.ed td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed tr:last-child td{border-bottom:0}
table.ed input,table.ed select,table.ed textarea{padding:6px 8px;font-size:.92rem}
table.ed textarea{min-height:44px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.xbtn{padding:4px 9px;color:var(--muted)}
.note{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;border-radius:var(--r);font-size:.9rem}
.note.info{background:var(--brand-soft);border-left-color:var(--brand)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.desc-item{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.desc-head{display:flex;gap:10px;align-items:center}
.desc-head .num{font-family:var(--f-mono);font-size:.85rem;color:var(--brand);flex:none}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:.95rem}
.checks li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--ok)}
.checks li.warn::before{background:var(--warn)}
.checks li.miss::before{background:transparent;border:2px solid var(--red)}
.outline{font-family:var(--f-display);font-size:.95rem;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.outline li{display:grid;grid-template-columns:4.2em 1fr;gap:6px;align-items:baseline}
.outline .num{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.outline .l1{font-weight:650;text-transform:uppercase;font-size:.88rem;padding-top:6px}
.outline .l2{text-transform:uppercase;font-size:.84rem}
.outline .l3{font-size:.9rem}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.92rem;max-width:calc(100% - 32px);z-index:20}
.saved{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  nav.steps{position:static;overflow-x:auto;margin-inline:-4px}
  nav.steps ol{flex-direction:row;gap:4px;padding:4px}
  nav.steps button{grid-template-columns:auto auto;white-space:nowrap;padding:6px 10px;border:1px solid var(--line)}
  nav.steps button .s{display:none}
  nav.steps button .dot{display:none}
  main h2{font-size:1.4rem}
  header.top{position:static}
  .logo{height:46px}
  .saved{display:none}
  .actions button{padding:7px 10px;font-size:.86rem}
}
@media (prefers-reduced-motion:no-preference){button,.mod{transition:border-color .15s,background-color .15s}}
</style>

function merge(base, data){ // mescla rascunho carregado sobre o modelo vazio
  if(Array.isArray(base)) return Array.isArray(data)? data : base;
  if(base && typeof base==='object'){ const o={...base}; if(data && typeof data==='object') for(const k in data){ o[k]= k in base? merge(base[k],data[k]) : data[k]; } return o; }
  return (data===undefined||data===null)? base : (typeof base==='string'? String(data) : data);
}
const getP=(p)=>p.split('.').reduce((o,k)=>o==null?o:o[k],S);
const setP=(p,v)=>{const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;};
const filled=v=>typeof v==='string'? v.trim().length>0 : !!v;

function migrate(d){ // rascunhos da primeira versão tinham local/supervisor/registro na identificação
  if(d&&d.ident&&d.mods){ const I=d.ident; const A=d.mods.A||{}, B=d.mods.B||{};
    if(A.on){ A.concedente=A.concedente||I.local||A.local||''; A.supervisor=A.supervisor||I.supervisor||''; A.registro=A.registro||I.registro||''; }
    if(B.on){ B.empresa=B.empresa||I.local||B.local||''; B.monitor=B.monitor||I.supervisor||''; B.registro=B.registro||I.registro||''; }
    delete I.local; delete I.supervisor; delete I.registro; }
  return d; }
function loadLocal(){ try{ const raw=localStorage.getItem(LSKEY); if(raw){ S=merge(blankState(), migrate(JSON.parse(raw))); return true; } }catch(e){} return false; }

const $=s=>document.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType? c : document.createTextNode(String(c))); }
  return e;
}
let uid=0;
function bind(input, path, onChange){
  input.value=getP(path)??'';
  input.addEventListener('input',()=>{ setP(path, input.value); scheduleSave(); refreshNav(); onChange&&onChange(input.value); });
  return input;
}
function field({label, path, type='text', help, ph, rows, req, options, count, min, max}){
  const id='f'+(++uid);
  let inp;
  if(type==='textarea') inp=h('textarea',{id,rows:rows||5,placeholder:ph});
  else if(type==='select') inp=h('select',{id}, (options||[]).map(o=>h('option',{value:o,text:o})));
  else inp=h('input',{id,type,placeholder:ph,min,max,inputmode:type==='number'?'numeric':null});
  const counter = count? h('span',{class:'counter'}) : null;
  const upd = v=>{ if(!counter) return; const n=words(v); counter.textContent=`${n} palavras${count.min?` · ideal ${count.min}–${count.max}`:''}`; counter.className='counter'+(count.min? (n>=count.min&&n<=count.max?' good':(n?' bad':'')):''); };
  bind(inp,path,upd); upd(inp.value);
  return h('div',{class:'field'},
    h('label',{for:id}, label, req? h('span',{class:'req',text:' *'}):null),
    help? h('p',{class:'help',text:help}):null, inp, counter);
}
function rowsEditor(path, cols, blank){

      let inp;
      if(c.type==='select') inp=h('select',{'aria-label':c.label}, c.options.map(o=>h('option',{value:o,text:o})));
      else if(c.type==='textarea') inp=h('textarea',{'aria-label':c.label,rows:2,placeholder:c.ph||''});
      else inp=h('input',{'aria-label':c.label,type:c.type||'text',placeholder:c.ph||'',inputmode:c.type==='number'?'numeric':null});

const cap1=s=>s? s.charAt(0).toLocaleUpperCase('pt-BR')+s.slice(1) : s;
const antesVirg=s=>(s||'').split(',')[0].trim();
function sugestao(){
  const ks=sel(); const k=ks[0]; const m=k?S.mods[k]:{}; const A=(S.ident.area||'').trim();
  const f=(v,lab)=>filled(v)? v.trim() : `[${lab}]`; const area=f(A,'área');
  let titulo='', subtitulo='';
  if(ks.length>1){
    const parte=k=>{ const m=S.mods[k]; switch(k){
      case 'A': return `estágio na ${f(antesVirg(m.concedente),'concedente')}`;
      case 'B': return `aprendizagem na ${f(antesVirg(m.empresa),'empresa')}`;
      case 'C': return m.tipo==='Atividade profissional autônoma'? 'atuação autônoma' : `atuação como ${f(m.cargo,'cargo').toLocaleLowerCase('pt-BR')} na ${f(antesVirg(m.organizacao),'organização')}`;
      case 'D': return `empreendimento ${f(m.empreendimento,'nome')}`;
      case 'E': return `${(m.tipo||'projeto').toLocaleLowerCase('pt-BR')} “${f(m.titulo,'título do projeto')}”`;
      case 'F': return `tutoria em ${f(m.disciplina,'disciplina')}`;
      case 'G': return `serviço voluntário na ${f(antesVirg(m.entidade),'entidade')}`; } };
    const ps=ks.map(parte);
    return {titulo:cap1(f(A,'área comum')), subtitulo: ps.slice(0,-1).join(', ')+' e '+ps[ps.length-1]};
  }
  switch(k){
    case 'A': titulo=`Estágio em ${area} na ${f(antesVirg(m.concedente),'concedente')}`; break;
    case 'B': titulo=`Aprendizagem em ${area} na ${f(antesVirg(m.empresa),'empresa')}`; break;
    case 'C': titulo= m.tipo==='Atividade profissional autônoma'? `Atuação autônoma em ${area}` : `Atuação como ${f(m.cargo,'cargo')} na ${f(antesVirg(m.organizacao),'organização')}`; break;
    case 'D': titulo=`${f(m.empreendimento,'empreendimento')}`; subtitulo=A? cap1(A) : '[principal atuação]'; break;
    case 'E': titulo=`${f(m.titulo,'título do projeto')}`; subtitulo=A? cap1(A) : '[principal atuação]'; break;
    case 'F': titulo=`Tutoria de aprendizagem em ${f(m.disciplina,'disciplina')}`; subtitulo=A? cap1(A) : ''; break;
    case 'G': titulo=`Serviço voluntário na ${f(antesVirg(m.entidade),'entidade')}`; subtitulo=A? cap1(A) : ''; break;
    default: titulo='[escolha a modalidade]';
  }
  return {titulo:cap1(titulo), subtitulo};
}

}

function caracOutline(){ // [{num, titulo, nivel, key, idx}]
  const ks=sel(), out=[];
  if(ks.length<=1){ const k=ks[0]; if(k) MODS[k].secoes.forEach(([t],i)=>out.push({num:`3.${i+1}`,titulo:t,nivel:2,key:k,idx:i})); }

  return out;
}

function checks(){
  const c=[]; const add=(ok,msg,lvl)=>c.push({ok,msg,lvl:ok?'ok':(lvl||'miss')});
  const miss=identReq.filter(k=>!filled(S.ident[k]));
  add(!miss.length, miss.length? `Identificação: faltam ${miss.length} campo(s) obrigatório(s).` : 'Identificação completa.');
  const ks=sel(); add(ks.length>0, ks.length? `Modalidade(s): ${ks.map(k=>MODS[k].nome).join(', ')}.` : 'Nenhuma modalidade escolhida.');
  if(multiOri()){ const n=orientadores().length; add(n>1, n>1? `${n} orientadores(as) assinarão o Termo de Validação.` : 'Orientadores diferentes marcados, mas só um nome informado.','warn'); }
  ks.forEach(k=>{ const f=MODS[k].campos.filter(c=>c.req&&!filled(S.mods[k][c.k])); add(!f.length, f.length? `Dados de ${MODS[k].nome}: falta ${f.map(c=>c.l.toLowerCase()).join(', ')}.` : `Dados de ${MODS[k].nome} completos.`); });
  add(filled(S.ident.titulo), filled(S.ident.titulo)? 'Título definido.' : 'Título do relatório vazio (etapa Modalidades e título).');
  if(ks.length>1){ const soma=ks.reduce((a,k)=>a+(+S.mods[k].ch||0),0); if(+S.ident.ch && soma && soma!==+S.ident.ch) add(false,`Quadro 2: a soma por modalidade (${soma} h) difere do total (${S.ident.ch} h).`,'warn'); }
  add(filled(S.introducao),'Introdução'+(filled(S.introducao)?' escrita.':' vazia.'));
  if(ks.length){ const vz=ks.flatMap(k=>S.carac[k]).filter(v=>!filled(v)).length; add(!vz, vz? `Caracterização: ${vz} subseção(ões) vazia(s).`:'Caracterização completa.'); }

const dlCap = (window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
async function saveFile(filename, blob){
  const cap = await dlCap;
  if(cap){
    try{ await cap.save({filename, data:blob}); toast(`${filename} pronto.`); }
    catch(e){ if(e&&e.code==='declined') toast('Download cancelado.'); else if(e&&e.code==='rate_limited') toast('Já há um download aguardando confirmação.'); else toast('Não foi possível salvar o arquivo nesta visualização.'); }
    return;
  }
  const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(`${filename} baixado.`);
}
const slug=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);

function gerar(){
  if(!window.docx){ toast('A biblioteca de geração não carregou. Verifique a conexão e recarregue a página.'); return; }
  try{
    const doc=buildDoc();
    window.docx.Packer.toBlob(doc).then(b=>saveFile(`Relatorio_Pratica_Profissional_${slug(S.ident.estudante)||'estudante'}.docx`, b));
  }catch(err){ console.error(err); toast('Erro ao gerar o arquivo: '+err.message); }
}
